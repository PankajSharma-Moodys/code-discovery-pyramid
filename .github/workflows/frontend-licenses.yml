name: frontend licence gate

on:
  push:
    paths:
      - "web/frontend/package.json"
      - "web/frontend/package-lock.json"
      - "web/frontend/scripts/check-licenses.mjs"
      - "web/client/**"
      - ".github/workflows/frontend-licenses.yml"
  pull_request:
    paths:
      - "web/frontend/package.json"
      - "web/frontend/package-lock.json"
      - "web/frontend/scripts/check-licenses.mjs"
      - "web/client/**"
      - ".github/workflows/frontend-licenses.yml"

jobs:
  check-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: web/frontend
      - run: npm run check-licenses
        working-directory: web/frontend
