[project]
name = "code-scanner"
version = "0.1.0"
description = "Multi-language static analysis and quality scanner"
requires-python = ">=3.14"
dependencies = [
    "tree-sitter==0.26.0",
    "tree-sitter-language-pack==1.16.1",
    "pathspec",
    "jinja2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jsonschema",
    "check-jsonschema",
]

[project.scripts]
code-scanner = "code_scanner.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["code_scanner*"]
